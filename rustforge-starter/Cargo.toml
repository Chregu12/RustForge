[package]
name = "my-rustforge-app"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A RustForge application"

[dependencies]
# RustForge Framework - Core
rf-core = { path = "../crates/rf-core", features = ["axum"] }
rf-web = { path = "../crates/rf-web" }
rf-config = { path = "../crates/rf-config" }

# RustForge Framework - Database
rf-orm = { path = "../crates/rf-orm" }

# RustForge Framework - Authentication
rf-auth = { path = "../crates/rf-auth" }

# RustForge Framework - Views
rf-view = { path = "../crates/rf-view" }

# RustForge Framework - Validation
rf-validation = { path = "../crates/rf-validation" }

# RustForge Framework - Mail
rf-mail = { path = "../crates/rf-mail" }

# RustForge Framework - Queue
rf-queue = { path = "../crates/rf-queue" }

# RustForge Framework - Cache
rf-cache = { path = "../crates/rf-cache" }

# Web framework (RustForge builds on Axum; pin to 0.8 to match rf-web)
axum = { version = "0.8", features = ["macros", "json"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
# Testing
rf-testing = { path = "../crates/rf-testing" }

[[bin]]
name = "my-rustforge-app"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
