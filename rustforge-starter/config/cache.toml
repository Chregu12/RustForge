# Cache Configuration
#
# Configure your cache drivers and settings

[cache]
# Default cache driver (redis, memory, file)
default = "redis"

# Cache key prefix
prefix = "rustforge_cache"

# Redis Cache
[cache.stores.redis]
driver = "redis"
connection = "default"
database = 0

# Memory Cache (for development)
[cache.stores.memory]
driver = "memory"
max_size = 1000

# File Cache
[cache.stores.file]
driver = "file"
path = "storage/framework/cache"

# Redis Configuration
[redis]
# Default Redis connection
default = "default"

# Redis Connections
[redis.connections.default]
host = "127.0.0.1"
port = 6379
password = ""
database = 0
pool_size = 10

[redis.connections.cache]
host = "127.0.0.1"
port = 6379
password = ""
database = 1
pool_size = 10

[redis.connections.session]
host = "127.0.0.1"
port = 6379
password = ""
database = 2
pool_size = 10
