# Queue Configuration
#
# Configure your job queue settings

[queue]
# Default queue connection (redis, database, sync)
default = "redis"

# Failed jobs database table
failed_table = "failed_jobs"

# Redis Queue
[queue.connections.redis]
driver = "redis"
connection = "default"
queue = "default"
retry_after = 90
block_for = 0

# Database Queue
[queue.connections.database]
driver = "database"
table = "jobs"
queue = "default"
retry_after = 90

# Sync Queue (for development - runs immediately)
[queue.connections.sync]
driver = "sync"

# Worker Configuration
[queue.worker]
# Number of worker processes
processes = 4

# Maximum number of jobs to process
max_jobs = 1000

# Maximum time to run (in seconds)
max_time = 3600

# Memory limit (in MB)
memory_limit = 128

# Sleep duration when no jobs available (in seconds)
sleep = 3

# Maximum number of tries
tries = 3

# Timeout for each job (in seconds)
timeout = 60

# Backoff strategy (fixed, exponential)
backoff = "exponential"
