name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rustforge
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rustforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-

      - name: Build tests
        env:
          DATABASE_URL: postgresql://rustforge:testpass@localhost:5432/rustforge_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --workspace --exclude rf-mail --no-run --verbose

      - name: Run tests
        env:
          DATABASE_URL: postgresql://rustforge:testpass@localhost:5432/rustforge_test
          REDIS_URL: redis://localhost:6379
          RUST_LOG: info
        run: cargo test --workspace --exclude rf-mail --verbose -- --test-threads=1
