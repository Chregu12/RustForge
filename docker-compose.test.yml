version: '3.8'

# Docker Compose configuration for automated testing
#
# This file defines the services required for comprehensive integration testing:
# - Redis: For queue and cache testing
# - PostgreSQL: For database testing
# - MailHog: For email testing
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   cargo test
#   docker-compose -f docker-compose.test.yml down

services:
  # Redis service for queue and cache testing
  redis:
    image: redis:7-alpine
    container_name: rustforge_redis_test
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=testpass
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_test_data:/data
    networks:
      - rustforge_test

  # PostgreSQL service for database testing
  postgres:
    image: postgres:15-alpine
    container_name: rustforge_postgres_test
    environment:
      POSTGRES_USER: rustforge
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: rustforge_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustforge"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - rustforge_test

  # MailHog service for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: rustforge_mailhog_test
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1025"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rustforge_test

  # MinIO service for S3-compatible storage testing
  minio:
    image: minio/minio:latest
    container_name: rustforge_minio_test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - minio_test_data:/data
    networks:
      - rustforge_test

  # Optional: Elasticsearch for search functionality testing
  # Uncomment to enable Elasticsearch testing
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
  #   container_name: rustforge_elasticsearch_test
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #   ports:
  #     - "9200:9200"
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - rustforge_test

volumes:
  redis_test_data:
    driver: local
  postgres_test_data:
    driver: local
  minio_test_data:
    driver: local

networks:
  rustforge_test:
    driver: bridge
