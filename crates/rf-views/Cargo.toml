[package]
name = "rf-views"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Core Team <dev@rustforge.rs>"]
license = "MIT OR Apache-2.0"
description = "Blade-like template system for RustForge with Tera integration"
keywords = ["templates", "views", "tera", "blade", "axum"]
categories = ["template-engine", "web-programming"]

[dependencies]
# Template Engine
tera = "1.19"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Web Framework
axum = { workspace = true }
tower = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Date/Time
chrono = { workspace = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
once_cell = { workspace = true }
regex = { workspace = true }
globset = "0.4"

# Compatibility re-exports from rf-view (global/singleton-style engine)
rf-view = { path = "../rf-view" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"

# [[example]]
# name = "basic_rf_views"
# path = "examples/basic.rs"
