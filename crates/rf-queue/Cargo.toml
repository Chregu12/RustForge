[package]
name = "rf-queue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
chrono.workspace = true
uuid.workspace = true

# Redis support (optional)
redis = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }

# Database support (optional)
sea-orm = { workspace = true, optional = true }

# AWS SQS support (optional)
aws-config = { version = "1.0", optional = true }
aws-sdk-sqs = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[features]
default = []
redis-backend = ["redis", "deadpool-redis"]
database = ["sea-orm"]
sqs = ["aws-config", "aws-sdk-sqs"]
all-backends = ["redis-backend", "database", "sqs"]
