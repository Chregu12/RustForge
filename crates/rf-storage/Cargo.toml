[package]
name = "rf-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rf-async-bridge = { path = "../rf-async-bridge" }
async-trait.workspace = true
once_cell.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
chrono.workspace = true
bytes = "1.5"
futures = "0.3"

# AWS S3 support
aws-config = "1.5"
aws-sdk-s3 = "1.68"
aws-smithy-types = "1.2"

# HTTP support for streaming
axum = "0.8"
serde_json = "1.0"
# Optional: FileService wrapper that adapts StoragePort from rf-plugins (beta).
# Enable with `features = ["plugins"]` to expose rf_storage::service::FileService.
rf-plugins = { path = "../../extensions/rf-plugins", optional = true }

[features]
# Expose rf_storage::service::FileService, which wraps the StoragePort /
# CommandError contracts from rf-plugins (a beta crate).  Off by default so
# the stable rf-storage core does not pull in any beta dependencies.
plugins = ["dep:rf-plugins"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3.8"
tracing-subscriber.workspace = true

[package.metadata.rustforge]
tier = "stable"
