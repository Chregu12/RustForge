[package]
name = "rf-spark"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SaaS billing and subscription management for RustForge - Laravel Spark/Cashier inspired"
keywords = ["billing", "subscriptions", "stripe", "saas", "payments"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
futures.workspace = true
reqwest.workspace = true

# Stripe API (most common payment provider)
# Features: billing (subscriptions, invoices), checkout, connect, webhook-events
stripe = { package = "async-stripe", version = "0.39", default-features = false, features = [
    "runtime-tokio-hyper-rustls",
    "billing",          # Subscriptions, Invoices, Plans, Prices
    "checkout",         # Checkout Sessions
    "connect",          # Connected accounts (needed for webhook-events)
    "webhook-events",   # Webhook event parsing
] }

# Paddle API alternative
# paddle = "0.1" # Would be added if Paddle support is needed

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Currency handling
rust_decimal = { version = "1.33", features = ["serde"] }

[features]
default = ["stripe"]
stripe = []
paddle = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
