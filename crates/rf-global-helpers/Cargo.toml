[package]
name = "rf-global-helpers"
version = "0.1.0"
edition = "2021"
description = "Laravel-style global helper functions for RustForge framework"
license = "MIT"

[dependencies]
# Web framework
axum = "0.7"
http = "1.0"
tower = "0.4"

# Async support
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Password hashing
bcrypt = "0.15"
argon2 = { version = "0.5", features = ["std"] }

# URL encoding
urlencoding = "2"

# Session/CSRF
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"

# Internal dependencies
rf-response = { path = "../rf-response" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
