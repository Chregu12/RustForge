[package]
name = "rf-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Authentication system for RustForge - JWT, session-based, and multi-guard authentication"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["auth", "authentication", "jwt", "security", "laravel"]
categories = ["authentication", "web-programming"]

[dependencies]
# Workspace dependencies
# `axum` feature enables `impl IntoResponse for AppError`, used by `require_auth`
# to render the framework's JSON 401 envelope.
rf-core = { path = "../rf-core", features = ["axum"] }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }

# Axum integration
axum.workspace = true
async-trait.workspace = true
tower.workspace = true

# Authentication
bcrypt = "0.15"
argon2 = "0.5"
jsonwebtoken = "9.3"
uuid = { version = "1.11", features = ["v4", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Authorization
once_cell = "1.19"
futures = "0.3"

# Auth features (email verification, password reset, remember me)
rf-mail = { path = "../rf-mail", optional = true }

[features]
default = []
mail = ["rf-mail"]

[dev-dependencies]
tokio-test = "0.4"
rf-mail = { path = "../rf-mail" }

[package.metadata.rustforge]
tier = "stable"
