[package]
name = "rf-metrics"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
prometheus = "0.13"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tower = "0.5"

[dev-dependencies]
tokio-test = "0.4"
