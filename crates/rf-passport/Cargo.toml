[package]
name = "rf-passport"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Laravel Passport-style OAuth2 server for RustForge"
license = "MIT"

[dependencies]
# Core
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto & Security
sha2 = "0.10"
base64 = "0.21"
rand = "0.8"
hex = "0.4"

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# HTTP
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
http = "1.0"
headers = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
once_cell = "1.19"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }

# [[example]]
# name = "full_example"
# path = "examples/full_example.rs"
