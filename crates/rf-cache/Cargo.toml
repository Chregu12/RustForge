[package]
name = "rf-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
redis = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }

# Memcached support
memcache = { version = "0.17", optional = true }

# Database support
sea-orm = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# File cache support
md5 = { version = "0.7", optional = true }

# For probabilistic operations
rand = { version = "0.8", optional = true }

[features]
default = []
redis-backend = ["redis", "deadpool-redis"]
memcached = ["dep:memcache"]
database = ["sea-orm", "chrono", "rand"]
file = ["md5"]
all-backends = ["redis-backend", "memcached", "database", "file"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3.12"
