[package]
name = "rf-route-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style Route facade for RustForge framework"
license = "MIT"

[dependencies]
# Core dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
http = "1.0"
tokio = { version = "1.0", features = ["full"] }

# Async support
async-trait = "0.1"
futures = "0.3"

# Thread-safe state management
once_cell = "1.19"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Internal dependencies
rf-routing = { path = "../rf-routing" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
