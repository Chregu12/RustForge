[package]
name = "rf-config-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style Config facade for RustForge"
license = "MIT OR Apache-2.0"

[dependencies]
rf-config = { path = "../rf-config" }
once_cell = "1.19"
tokio = { version = "1.35", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["sync", "macros", "rt"] }
