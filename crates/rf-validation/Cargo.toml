[package]
name = "rf-validation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Laravel-inspired validation system for RustForge - Fluent, expressive validation rules"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["validation", "validator", "laravel", "form", "input"]
categories = ["web-programming", "data-structures"]

[features]
default = []
derive = ["rf-validation-derive"]

[dependencies]
# Workspace dependencies
rf-core = { path = "../rf-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# Axum integration
axum.workspace = true
async-trait.workspace = true
tower.workspace = true

# Database integration (for database rules)
sea-orm.workspace = true
# Real DB facade (rusqlite-backed) used by the validate! unique/exists rules
rf-orm = { path = "../rf-orm" }

# Validation
validator = { version = "0.18", features = ["derive"] }
regex = "1.10"
once_cell = "1.19"

# Derive macro (optional)
rf-validation-derive = { path = "../rf-validation-derive", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-test = "0.4"
tower = { workspace = true }
