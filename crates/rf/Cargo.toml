[package]
name = "rf"
description = "RustForge - Simplified imports for the Laravel-inspired Rust web framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["web", "framework", "laravel", "rust", "prelude"]
categories = ["web-programming::http-server", "web-programming"]

[dependencies]
# All facades are now merged into their main crates:
# - Route facade → rf-routing/src/facade/
# - DB facade → rf-orm/src/facade/
# - Mail facade → rf-mail/src/facade.rs
# - Sanctum facade → rf-sanctum/src/facade/
# - Passport facade → rf-passport/src/facade/

# Helpers & Macros
rf-global-helpers = { path = "../rf-global-helpers" }
rf-helpers = { path = "../../extensions/rf-helpers" }
rf-macros = { path = "../rf-macros" }

# Core
# `axum` feature: pulls in rf-core's `impl IntoResponse for AppError`, so a
# handler returning `AppResult<impl IntoResponse>` (the terse `?` path re-exported
# through `rf::prelude`) has its error variant render the correct HTTP status.
rf-core = { path = "../rf-core", features = ["axum"] }
rf-web = { path = "../rf-web" }
rf-config = { path = "../rf-config" }
rf-routing = { path = "../rf-routing" }
rf-request = { path = "../rf-request" }
rf-response = { path = "../rf-response" }

# Database & ORM
rf-orm = { path = "../rf-orm" }
rf-eloquent = { path = "../rf-eloquent" }
rf-model-macro = { path = "../rf-model-macro" }
# Backing store + trait for the Model!/create!/find!/update!/delete! macros.
# The `rf_macros` model macros expand to code referencing `rf_db_facade::Model`,
# `serde_json::`, `serde::` and `chrono::` by crate name, so the `rf` facade must
# bring those names into scope (see `prelude`) for an `rf`-only consumer to use
# the macros it advertises.
rf-db-facade = { path = "../../extensions/rf-db-facade" }
# Facade crates that the rf_macros helper macros (event!/send_mail!/cache!/auth!/
# storage!/redirect!/session!/view!/back!) expand to by crate name. The `rf`
# umbrella re-exports these (see `prelude`) so an `rf`-only consumer using
# `use rf::prelude::*` can actually use the macros it advertises.
rf-event-facade = { path = "../../extensions/rf-event-facade" }
rf-mail-facade = { path = "../../extensions/rf-mail-facade" }
rf-cache-facade = { path = "../../extensions/rf-cache-facade" }
rf-auth-facade = { path = "../../extensions/rf-auth-facade" }
rf-storage-facade = { path = "../../extensions/rf-storage-facade" }
rf-route-facade = { path = "../../extensions/rf-route-facade" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }

# Auth & Security
rf-auth = { path = "../rf-auth" }
rf-authorization = { path = "../../extensions/rf-authorization" }
rf-sanctum = { path = "../rf-sanctum" }
rf-passport = { path = "../../extensions/rf-passport" }
rf-validation = { path = "../rf-validation" }
rf-validation-derive = { path = "../rf-validation-derive" }

# HTTP & API
rf-api-resources = { path = "../../extensions/rf-api-resources" }
rf-requests = { path = "../../extensions/rf-requests" }
rf-pagination = { path = "../../extensions/rf-pagination" }
rf-collections = { path = "../../extensions/rf-collections" }

# Jobs & Events
rf-jobs = { path = "../rf-jobs" }
rf-queue = { path = "../rf-queue" }
rf-events = { path = "../rf-events" }
rf-notifications = { path = "../rf-notifications" }

# Storage & Mail
rf-storage = { path = "../rf-storage" }
rf-mail = { path = "../rf-mail" }
rf-upload = { path = "../../extensions/rf-upload" }

# Cache & Session
rf-cache = { path = "../rf-cache" }

# Testing
rf-testing = { path = "../../extensions/rf-testing" }

# Views
rf-blade = { path = "../../extensions/rf-blade" }
rf-view = { path = "../../extensions/rf-view" }
rf-inertia = { path = "../../extensions/rf-inertia" }

# Broadcasting
rf-broadcast = { path = "../rf-broadcast" }
rf-sse = { path = "../../extensions/rf-sse" }

# Logging & Monitoring
rf-logging = { path = "../rf-logging" }
rf-metrics = { path = "../rf-metrics" }
rf-nightwatch = { path = "../../extensions/rf-nightwatch" }

# Errors
rf-errors = { path = "../../extensions/rf-errors" }

# Testing
rf-pest = { path = "../../extensions/rf-pest" }

# Payments
rf-cashier = { path = "../../extensions/rf-cashier" }

# AI Integration
rf-mcp = { path = "../../extensions/rf-mcp" }

[features]
default = []
full = []

[package.metadata.rustforge]
tier = "stable"
