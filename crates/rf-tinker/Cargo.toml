[package]
name = "rf-tinker"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Laravel Tinker-style interactive REPL for RustForge"
license = "MIT"
keywords = ["repl", "tinker", "interactive", "shell", "debug"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# REPL
rustyline = "14.0"

# Async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Output formatting
colored = "2.1"
tabled = "0.16"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Environment
dotenvy = "0.15"

# Syntax highlighting
syntect = "5.2"

# Expression parsing
regex = "1.10"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
