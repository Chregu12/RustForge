[package]
name = "rf-db-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style DB facade for RustForge"
license = "MIT OR Apache-2.0"

[dependencies]
rf-orm = { path = "../rf-orm" }
once_cell = "1.19"
tokio = { version = "1.35", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }

[package.metadata.rustforge]
tier = "stub"
