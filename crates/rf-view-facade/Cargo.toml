[package]
name = "rf-view-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style View facade for RustForge"
license = "MIT OR Apache-2.0"

[dependencies]
rf-view = { path = "../rf-view" }
once_cell = "1.19"
tokio = { version = "1.35", features = ["sync"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["sync", "macros", "rt"] }
