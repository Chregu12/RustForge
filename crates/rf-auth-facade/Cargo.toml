[package]
name = "rf-auth-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style Auth facade for RustForge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustForge/rustforge"

[dependencies]
rf-auth = { path = "../rf-auth" }
once_cell = "1.19"
tokio = { version = "1.35", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
