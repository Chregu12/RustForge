[package]
name = "rf-model-macro"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for RustForge models - Laravel-like syntax"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
Inflector = "0.11"  # For pluralization (users -> User)

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1.1", features = ["macros", "with-chrono"], default-features = false }
# Dev-only (cargo permits the dev-dependency cycle): the `#[model]` expansion
# implements `rf_db_facade::Model`, so the compile test needs it in scope.
rf-db-facade = { path = "../rf-db-facade" }
