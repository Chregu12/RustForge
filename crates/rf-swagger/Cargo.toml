[package]
name = "rf-swagger"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
description = "EXPERIMENTAL — not part of the RustForge 1.0 supported surface; API may change without a SemVer bump. Thin utoipa/OpenAPI integration layer for RustForge."

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "4.2"
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
utoipa-redoc = { version = "3.0", features = ["axum"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
