[package]
name = "rf-request"
version = "0.1.0"
edition = "2021"
authors = ["Rust DX Framework Contributors"]
description = "Laravel-style request handling for Rust DX Framework"
license = "MIT"

[dependencies]
axum = "0.7"
http = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
rf-validation = { path = "../rf-validation" }

[dev-dependencies]
tower = "0.4"
hyper = "1.0"
