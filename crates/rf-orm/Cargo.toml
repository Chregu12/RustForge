[package]
name = "rf-orm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Eloquent-inspired ORM for RustForge - Simple, elegant database interactions"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["orm", "database", "eloquent", "seaorm", "laravel"]
categories = ["database"]

[dependencies]
# Internal dependencies
rf-core = { path = "../rf-core" }
rf-config = { path = "../rf-config" }
rf-model-macro = { path = "../rf-model-macro" }
# rf-cache integration uses decoupled QueryCacheStore trait (no direct dependency needed)
rf-metrics = { path = "../rf-metrics", optional = true }

# SeaORM
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "macros"] }

# Async
tokio.workspace = true
async-trait.workspace = true
futures = "0.3"  # For async iterators (chunking)

# Serialization
serde.workspace = true
serde_json.workspace = true
once_cell.workspace = true

# Synchronous SQLite driver backing the sync `DB` facade (no async runtime needed).
# 0.32 pins libsqlite3-sys 0.30 to match sqlx (via sea-orm), so both share a
# single bundled SQLite build instead of conflicting.
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
log = "0.4"

# Time
chrono.workspace = true

# Performance optimization
parking_lot = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

# [[example]]
# name = "basic_usage_rf_orm"
# path = "examples/basic_usage.rs"
# 
[features]
default = []
# Migration support (separate feature to avoid build time increase)
migrate = ["sea-orm-migration"]
metrics = ["rf-metrics"]
# Enable integration tests that require a live database connection
integration-tests = []

[dependencies.sea-orm-migration]
version = "0.12"
optional = true
