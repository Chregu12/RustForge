[package]
name = "rf-passport-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style Passport facade for RustForge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustForge/rustforge"

[dependencies]
rf-passport = { path = "../rf-passport" }
once_cell = "1.19"
tokio = { version = "1.35", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
chrono = "0.4"
sea-orm = "1.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }

[package.metadata.rustforge]
tier = "stub"
