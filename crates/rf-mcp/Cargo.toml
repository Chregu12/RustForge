[package]
name = "rf-mcp"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Laravel MCP-style AI integration for RustForge (Model Context Protocol)"
license = "MIT"
keywords = ["mcp", "ai", "llm", "anthropic", "claude"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# Async
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utils
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
regex = "1.10"
base64 = "0.21"

[dev-dependencies]
tokio = { version = "1.37", features = ["full", "test-util"] }
