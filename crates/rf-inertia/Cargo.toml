[package]
name = "rf-inertia"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Inertia.js adapter for RustForge - Build modern single-page apps with server-side routing"
license = "MIT"
keywords = ["inertia", "spa", "vue", "react", "svelte"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
http = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
once_cell = "1.19"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
axum-test = "15.0"
tower = { version = "0.4", features = ["util"] }
