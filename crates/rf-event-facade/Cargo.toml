[package]
name = "rf-event-facade"
version = "0.1.0"
edition = "2021"
description = "Laravel-style Event facade for RustForge"
license = "MIT OR Apache-2.0"

[dependencies]
rf-events = { path = "../rf-events" }
once_cell = "1.19"
tokio = { version = "1.35", features = ["sync"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
