[package]
name = "rf-i18n"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable the axum-0.8 AcceptLanguage extractor and per-request locale helpers.
axum = ["dep:axum"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
handlebars = "5.0"
tracing = "0.1"
axum = { version = "0.8", optional = true }

[dev-dependencies]
