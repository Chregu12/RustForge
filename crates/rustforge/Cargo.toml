[package]
name = "rustforge"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.79.0"
description = "RustForge - The Laravel of Rust. Import everything with one line."
license = "MIT"
repository = "https://github.com/Chregu12/RustForge"
keywords = ["rustforge", "laravel", "web", "framework", "orm"]
categories = ["web-programming"]

[dependencies]
# Macros
rf-macros = { path = "../rf-macros" }
rf-model-macro = { path = "../rf-model-macro" }

# Facades
rf-auth-facade = { path = "../rf-auth-facade" }
rf-cache-facade = { path = "../rf-cache-facade" }
rf-db-facade = { path = "../rf-db-facade" }
rf-event-facade = { path = "../rf-event-facade" }
rf-storage-facade = { path = "../rf-storage-facade" }
rf-route-facade = { path = "../rf-route-facade" }
rf-sanctum-facade = { path = "../rf-sanctum-facade" }
rf-passport-facade = { path = "../rf-passport-facade" }

# Core
rf-request = { path = "../rf-request" }
rf-response = { path = "../rf-response" }
rf-validation = { path = "../rf-validation" }

# Authentication - Laravel Sanctum & Passport
rf-sanctum = { path = "../rf-sanctum" }
rf-passport = { path = "../rf-passport" }

# Admin & Monitoring - Laravel Nova & Horizon
rf-nova = { path = "../rf-nova" }
rf-horizon = { path = "../rf-horizon" }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
