[package]
name = "rf-seeder"
version = "0.1.0"
edition = "2021"
description = "Database seeding for RustForge - Laravel-style seeders"
license = "MIT"
repository = "https://github.com/Chregu12/RustForge"

[dependencies]
async-trait = "0.1"
fake = { version = "2.9", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
