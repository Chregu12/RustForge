[package]
name = "rf-routing"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
once_cell = "1.19"
hex = "0.4"
chrono = "0.4"
base64 = "0.22"
axum = "0.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"
http = "1.0"
regex = "1.10"

# For model binding
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
thiserror = "1.0"

# Per-route capture of matched path params into the implicit-request globals
# (`input("id")` for `/posts/:id`); wired into `build_router` as a route_layer.
rf-request = { path = "../rf-request" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"

# [[example]]
# name = "basic_usage_rf_routing"
# path = "examples/basic_usage.rs"
