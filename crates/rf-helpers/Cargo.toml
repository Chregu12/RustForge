[package]
name = "rf-helpers"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Laravel-style global helper functions for RustForge"
license = "MIT"

[dependencies]
# String manipulation
heck = "0.5"
inflector = "0.11"
deunicode = "1.6"

# Random
rand = "0.8"

# URL generation
url = "2.5"
percent-encoding = "2.3"

# Path handling
dirs = "5.0"

# HTTP
http = "1.0"
axum = "0.7"

# Serialization
serde = "1.0"
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
