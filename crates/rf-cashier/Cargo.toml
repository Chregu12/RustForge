[package]
name = "rf-cashier"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Laravel Cashier-style Stripe billing integration for RustForge"
license = "MIT"
keywords = ["stripe", "billing", "subscription", "payments", "cashier"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# Stripe API
stripe = { package = "async-stripe", version = "0.41", features = ["runtime-tokio-hyper-rustls"] }

# Async
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Database
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP
axum = { version = "0.8", features = ["macros"] }

# Utils
uuid = { version = "1.10", features = ["v4", "serde"] }

# Crypto for webhook verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.37", features = ["full", "test-util"] }
