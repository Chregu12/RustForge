[package]
name = "rf-envoy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SSH deployment task runner for RustForge - Laravel Envoy inspired"
keywords = ["deployment", "ssh", "automation", "devops", "tasks"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
chrono.workspace = true
tracing.workspace = true
futures.workspace = true
regex.workspace = true

# HTTP client for notifications
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Temporary files for SSH key generation
tempfile = "3.15"

# SSH client placeholder — actual russh integration is deferred; the current
# implementation shells out to the system ssh/scp binaries (see ssh.rs).
# Add russh = "0.62" (>=0.60.3 fixes RUSTSEC-2026-0154) when the native SSH
# implementation lands.

# Templating for Blade-like syntax in Envoy files
handlebars = "5.1"

# YAML/TOML parsing for envoy files
toml.workspace = true

# Command execution
tokio-stream = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
