[package]
name = "rf-envoy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SSH deployment task runner for RustForge - Laravel Envoy inspired"
keywords = ["deployment", "ssh", "automation", "devops", "tasks"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
futures.workspace = true
regex.workspace = true

# SSH client
russh = "0.46"
russh-keys = "0.46"

# Templating for Blade-like syntax in Envoy files
handlebars = "5.1"

# YAML/TOML parsing for envoy files
toml.workspace = true

# Command execution
tokio-stream = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
