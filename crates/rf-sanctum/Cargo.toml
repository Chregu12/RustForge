[package]
name = "rf-sanctum"
version = "0.1.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Laravel Sanctum-style API token authentication for RustForge"
license = "MIT"

[dependencies]
# Core
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# HTTP
axum = "0.7"
http = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
