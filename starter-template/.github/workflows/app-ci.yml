# RustForge App CI Workflow
# This workflow runs on every push and pull request to ensure code quality.
#
# Features:
# - Format checking with rustfmt
# - Linting with clippy
# - Unit and integration tests
# - Rust build caching for faster builds
# - Optional PostgreSQL service for database tests

name: App CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Database configuration (used when services.postgres is enabled)
  DATABASE_URL: "postgres://app_user:app_password@localhost:5432/app_db"

jobs:
  # ===========================================
  # Job 1: Format, Lint, and Test (No Database)
  # ===========================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build project
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  # ===========================================
