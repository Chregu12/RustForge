[package]
name = "rustforge-app"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (SeaORM with PostgreSQL/MySQL/SQLite support)
sea-orm = { version = "1.1", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "macros",
    "with-chrono",
    "with-uuid"
] }
sea-orm-migration = "1.1"

# Authentication & Security
argon2 = "0.5"
jsonwebtoken = "9.2"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Configuration & Environment
dotenvy = "0.15"
config = "0.14"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
# Testing
tower = { version = "0.4", features = ["util"] }
axum-test = "15.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
