[package]
name = "deployment-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rf-core = { path = "../../crates/rf-core", features = ["validation"] }
rf-validation = { path = "../../crates/rf-validation" }
rf-auth = { path = "../../crates/rf-auth", features = ["mail"] }
rf-cache = { path = "../../crates/rf-cache" }
rf-config = { path = "../../crates/rf-config" }
rf-collections = { path = "../../crates/rf-collections" }
rf-web = { path = "../../crates/rf-web" }
rf-routing = { path = "../../crates/rf-routing" }
rf-pagination = { path = "../../crates/rf-pagination" }
rf-container = { path = "../../crates/rf-container" }
rf-eloquent = { path = "../../crates/rf-eloquent" }
rf-mail = { path = "../../crates/rf-mail" }
rf-storage = { path = "../../crates/rf-storage" }
rf-encryption = { path = "../../crates/rf-encryption" }
rf-events = { path = "../../crates/rf-events" }
rf-queue = { path = "../../crates/rf-queue" }
rf-scheduler = { path = "../../crates/rf-scheduler" }
rf-health = { path = "../../crates/rf-health" }
rf-testing = { path = "../../crates/rf-testing" }

anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.37", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
async-trait = "0.1"
