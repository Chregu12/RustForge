[package]
name = "rustforge-api-example"
version = "0.1.0"
edition = "2021"
description = "Example RustForge backend API for starter kit integration"

[dependencies]
rustforge = { path = "../../crates/rustforge" }
rf-sanctum = { path = "../../crates/rf-sanctum" }
rf-web = { path = "../../crates/rf-web" }
rf-routing = { path = "../../crates/rf-routing" }
rf-validation = { path = "../../crates/rf-validation" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
