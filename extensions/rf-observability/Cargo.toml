[package]
name = "rf-observability"
description = "OpenTelemetry, Prometheus metrics, and distributed tracing for Foundry"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Core dependencies
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
axum.workspace = true
tower.workspace = true

# OpenTelemetry dependencies
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics"] }
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Prometheus dependencies
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.5"

# HTTP and utilities
http = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
uuid.workspace = true

# Foundry dependencies
rf-plugins = { path = "../rf-plugins" }

[dev-dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
tempfile = "3.10"
tokio-test = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "transport"] }

# [[example]]
# name = "basic_usage_foundry_observability"
# path = "examples/basic_usage.rs"

[package.metadata.rustforge]
tier = "beta"
