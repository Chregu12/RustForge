[package]
name = "framework-test"
version = "1.0.0"
edition = "2021"
authors = ["RustForge Team"]
description = "Comprehensive test application demonstrating ALL RustForge framework features"

[[bin]]
name = "framework-test"
path = "src/main.rs"

[dependencies]
# Core framework dependencies
anyhow = "1.0"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Web framework
axum = { version = "0.8", features = ["macros", "json", "multipart", "ws"] }
tower = { version = "0.4", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "compression-full", "trace"] }
tower-sessions = "0.12"

# Database & ORM
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "macros", "with-rust_decimal", "with-chrono"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite"] }

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"
bcrypt = "0.15"
base64 = "0.21"

# Validation
validator = { version = "0.18", features = ["derive"] }
regex = "1.10"

# Cache & Queue (Redis)
redis = { version = "0.24", features = ["aio", "tokio-comp", "connection-manager"] }
deadpool-redis = "0.14"

# Mail
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# Storage (S3)
aws-sdk-s3 = "1.13"
aws-config = "1.1"

# Search
meilisearch-sdk = "0.25"

# GraphQL
async-graphql = { version = "7.0", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.0"

# Frontend integration
# For Inertia.js support (JSON responses with shared data)
# For htmx support (HTML fragments)

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Testing
mockall = "0.12"
fake = { version = "2.9", features = ["derive", "chrono"] }

# Utilities
thiserror = "1.0"
config = "0.14"
toml = "0.8"
cron = "0.13"
futures = "0.3"
dashmap = "5.5"
once_cell = "1.19"

# WebSockets & Broadcasting
tokio-tungstenite = "0.21"

# RustForge Framework Crates (using workspace)
# Core
rf-core = { path = "../crates/rf-core" }
rf-web = { path = "../crates/rf-web" }
rf-config = { path = "../crates/rf-config" }
rf-container = { path = "../crates/rf-container" }

# ORM & Database
rf-orm = { path = "../crates/rf-orm" }
rf-eloquent = { path = "../crates/rf-eloquent" }
rf-collections = { path = "../crates/rf-collections" }

# Auth & Authorization
rf-auth = { path = "../crates/rf-auth" }
rf-authorization = { path = "../crates/rf-authorization" }
rf-sanctum = { path = "../crates/rf-sanctum" }
rf-2fa = { path = "../crates/rf-2fa" }

# Validation
rf-validation = { path = "../crates/rf-validation" }
rf-requests = { path = "../crates/rf-requests" }

# Jobs & Queue
rf-jobs = { path = "../crates/rf-jobs" }
rf-queue = { path = "../crates/rf-queue" }
rf-scheduler = { path = "../crates/rf-scheduler" }

# Mail & Notifications
rf-mail = { path = "../crates/rf-mail" }
rf-notifications = { path = "../crates/rf-notifications" }

# Cache & Storage
rf-cache = { path = "../crates/rf-cache" }
rf-storage = { path = "../crates/rf-storage" }

# Events & Broadcasting
rf-events = { path = "../crates/rf-events" }
rf-broadcast = { path = "../crates/rf-broadcast" }
rf-broadcasting = { path = "../crates/rf-broadcasting" }

# Search
rf-search = { path = "../crates/rf-search" }

# API & Resources
rf-api-resources = { path = "../crates/rf-api-resources" }
rf-routing = { path = "../crates/rf-routing" }
rf-pagination = { path = "../crates/rf-pagination" }

# Rate Limiting
rf-ratelimit = { path = "../crates/rf-ratelimit" }

# Monitoring
rf-horizon = { path = "../crates/rf-horizon" }
rf-telescope = { path = "../crates/rf-telescope" }
rf-health = { path = "../crates/rf-health" }

# Testing
rf-testing = { path = "../crates/rf-testing" }

# Admin
rf-admin = { path = "../crates/rf-admin" }

# Misc
rf-i18n = { path = "../crates/rf-i18n" }
rf-helpers = { path = "../crates/rf-helpers" }
rf-errors = { path = "../crates/rf-errors" }
rf-inertia = { path = "../crates/rf-inertia" }

[dev-dependencies]
tempfile = "3.10"
wiremock = "0.6"

[features]
default = ["sqlite"]
sqlite = []
postgres = []
full = ["sqlite", "postgres"]
