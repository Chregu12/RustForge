# S3 backend for the GitHub Actions live tests. The test client expects
# minioadmin credentials and connects to localhost:9000.
services:
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "false"
