# ---------------------------------------------------------------------------
# BANS
# ---------------------------------------------------------------------------
[bans]
# Warn (not fail) on duplicate dep versions — the lockfile has intentional
# dual-version situations (e.g. reqwest 0.11 from async-stripe, rand 0.7/0.8/0.9
# from different transitive deps).
multiple-versions = "warn"

# Allow wildcards in version specifiers (common in optional deps).
wildcards = "allow"

# ---------------------------------------------------------------------------
# SOURCES
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git      = "warn"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
