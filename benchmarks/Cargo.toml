[package]
name = "rustforge-benchmarks"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[dependencies]
# Framework crates
rf-orm = { path = "../crates/rf-orm" }
rf-eloquent = { path = "../crates/rf-eloquent" }
rf-validation = { path = "../crates/rf-validation" }
rf-cache = { path = "../crates/rf-cache" }
rf-queue = { path = "../crates/rf-queue" }
rf-async-bridge = { path = "../crates/rf-async-bridge" }
rf-request = { path = "../crates/rf-request" }
bytes = "1"

# Core dependencies
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
sqlx = { workspace = true }

# Benchmarking
criterion = { workspace = true }
parking_lot = "0.12"
rand = "0.8"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "orm_benchmarks"
harness = false

[[bench]]
name = "cache_benchmarks"
harness = false

[[bench]]
name = "validation_benchmarks"
harness = false

[[bench]]
name = "blade_benchmarks"
harness = false

[[bench]]
name = "queue_benchmarks"
harness = false

# Real hot-path benchmarks (a–d): AsyncBridge, HTTP, SQLite, Validation
[[bench]]
name = "hot_paths"
harness = false

# RustForge DX vs raw axum — end-to-end overhead of the capture_request
# middleware, task-local scope, and input() helper vs plain axum extractors.
[[bench]]
name = "dx_vs_raw_axum"
harness = false

[profile.release]
debug = true  # Enable debug symbols for profiling
