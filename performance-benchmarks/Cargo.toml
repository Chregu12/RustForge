[package]
name = "performance-benchmarks"
version = "0.1.0"
edition = "2021"

[dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "performance_benchmarks"
path = "src/lib.rs"

[[bench]]
name = "queue_performance"
harness = false

[[bench]]
name = "cache_performance"
harness = false

[[bench]]
name = "orm_collection_performance"
harness = false

[[bench]]
name = "realworld_scenarios"
harness = false
