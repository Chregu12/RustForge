    "examples/blog-slice",
    "examples/rest-crud-resource",
    "examples/validated-signup",
    "examples/auth-paginated-search",
    "examples/phase12-blog",
    "examples/realtime-chat",
    "examples/taskflow",
    "examples/i18n-localized-api",
    # Cycle-4 flagship reference application (exercises every stable-core surface)
    "examples/reference-app",
    # Cycle-15 typed-DI reference example (no global facades; instance-based ORM)
    "examples/typed-service",
    # Benchmarks
    "benchmarks",
    # Legacy CLI (kept as foundry-cli)
    "crates/foundry-cli",
    # All other packages now use rf-* prefix
    "extensions/rf-application",
    "extensions/rf-domain",
    "extensions/rf-infra",
    "extensions/rf-plugins",
    "extensions/rf-api",
    "extensions/rf-interactive",
    "extensions/rf-console",
    "extensions/rf-service-container",
