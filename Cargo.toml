    "extensions/rf-forms",
    "extensions/rf-http-client",
    "extensions/rf-tinker-enhanced",
    "extensions/rf-maintenance",
    "extensions/rf-env",
    "extensions/rf-assets",
    "extensions/rf-command-executor",
    "extensions/rf-command-events",
    "extensions/rf-command-pipeline",
    "extensions/rf-signal-handler",
    "extensions/rf-observability",
    "extensions/rf-advanced-input",
    "extensions/rf-stub-system",
    "extensions/rf-verbosity",
    # Phase 21: Complete Laravel Parity (Dusk, Echo, Envoy, Sail, Spark)
    "extensions/rf-dusk",
    "extensions/rf-echo",
    "extensions/rf-envoy",
    "extensions/rf-sail",
    "extensions/rf-spark",
    "extensions/rf-mcp",
    "extensions/rf-nightwatch",
    # Deployment Tests
    "tests/deployment",
    # Committed probe-sweep integration tests (sandbox probes adapted for CI)
    "tests/probe-sweep",
]

# default-members: what plain `cargo build` / `cargo check` (no --workspace) builds.
# Experimental crates are listed in `members` so they still compile under
# `cargo check --workspace` (no bitrot), but they are excluded here so the
# default build surface only contains the supported 1.0 surfaces.
#
# Experimental crates (NOT in default-members):
#   rf-nova, rf-nova-macros   — Nova multi-resource dispatch
#   rf-swagger                — utoipa/OpenAPI integration
#   rf-telescope              — debugging dashboard
#   rf-cms                    — CMS features
#   rf-breeze                 — auth scaffolding generator
#   rf-vite                   — Vite asset pipeline
#   rf-livereload             — live-reload / HMR
default-members = [
    # Phase 2: New Modular Architecture (rf-*)
    "crates/rf-core",
    "crates/rf-web",
    "crates/rf-config",
    "crates/rf-orm",
    "crates/rf-model-macro",
    "crates/rf-auth",
    "crates/rf-validation",
    "crates/rf-validation-derive",
    "crates/rf-macros",
    "crates/rf-request",
    "crates/rf-jobs",
    "crates/rf-mail",
    "crates/rf-storage",
    "crates/rf-ratelimit",
    "crates/rf-broadcast",
    "crates/rf-health",
    "crates/rf-queue",
    "crates/rf-cache",
    "crates/rf-async-bridge",
    "crates/rf-logging",
    "crates/rf-metrics",
    # rf-swagger EXCLUDED (experimental)
    "crates/rf-events",
    "crates/rf-notifications",
    "crates/rf-i18n",
    # rf-vite EXCLUDED (experimental)
    # rf-livereload EXCLUDED (experimental)
    # rf-cms EXCLUDED (experimental)
    # rf-breeze EXCLUDED (experimental)
    # rf-views listed once above (near rf-view); duplicate entry removed
    # Phase 13: Eloquent ORM
    "crates/rf-eloquent",
    # Phase 14: API & Developer Experience
    "crates/rf-routing",
    "crates/rf-global-helpers",
    "crates/rustforge",
    "crates/rf",
    # Phase 15: Monitoring & Debugging
    # rf-telescope EXCLUDED (experimental)
    # rf-nova EXCLUDED (experimental)
    # rf-nova-macros EXCLUDED (experimental)
    # Phase 16: Error Handling
    # Phase 16-17: Ecosystem & Polish
    "crates/rf-response",
    "crates/rf-facades",
    "crates/forge-cli",
    # Phase 16-18: 100% Laravel Parity Features
    "crates/rf-sanctum",
    # Examples
    "examples/hello",
    "examples/database-demo",
    "examples/auth-demo",
    "examples/jobs-demo",
    "examples/jobs-offline",
    "examples/mail-demo",
    "examples/scaffold-demo",
    "examples/macros-demo",
    "examples/laravel-syntax-complete",
    "examples/laravel-syntax-simple",
    "examples/facades-demo",
    "examples/blog-slice",
    "examples/rest-crud-resource",
    "examples/validated-signup",
    "examples/auth-paginated-search",
    "examples/phase12-blog",
    "examples/realtime-chat",
    "examples/taskflow",
    "examples/i18n-localized-api",
    # Cycle-4 flagship reference application (exercises every stable-core surface)
    "examples/reference-app",
    # Cycle-15 typed-DI reference example (no global facades; instance-based ORM)
    "examples/typed-service",
    # Benchmarks
    "benchmarks",
    # Legacy CLI (kept as foundry-cli)
    "crates/foundry-cli",
    # All other packages now use rf-* prefix
    # Phase 21: Complete Laravel Parity (Dusk, Echo, Envoy, Sail, Spark)
    # Deployment Tests
    "tests/deployment",
    # Committed probe-sweep integration tests
    "tests/probe-sweep",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0-rc.2"
rust-version = "1.79.0"
license = "MIT OR Apache-2.0"
authors = ["chregu12"]
repository = "https://github.com/Chregu12/RustForge"
homepage = "https://github.com/Chregu12/RustForge"
documentation = "https://github.com/Chregu12/RustForge"
keywords = ["web", "framework", "laravel", "rest", "api"]
categories = ["web-programming::http-server", "web-programming"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde", "clock"] }
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "macros", "with-rust_decimal", "with-chrono"] }
axum = { version = "0.8", features = ["macros", "json", "multipart", "ws"] }
toml = "0.8"
rustyline = "14.0"
regex = "1.10"
console = "0.15"
indicatif = "0.17"
tokio-tungstenite = "0.21"
futures = "0.3"
tower = { version = "0.4", features = ["util"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
jsonwebtoken = "9.2"
argon2 = "0.5"
tower-sessions = "0.12"
bcrypt = "0.15"
async-graphql = { version = "7.0", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.0"

# Performance Optimizations (Phase 3)
rustc-hash = "1.1"
smallvec = { version = "1.13", features = ["serde"] }
rkyv = { version = "0.7", features = ["validation"] }
once_cell = "1.19"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
dhat = "0.3"
base64 = "0.21"
dashmap = "5.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# Phase 2: Additional dependencies
validator = { version = "0.18", features = ["derive"] }
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }
deadpool-redis = "0.18"
config = "0.14"
cron = "0.13"
num_cpus = "1.16"
