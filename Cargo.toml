    "extensions/rf-package-dev",
    "extensions/rf-providers",
    "extensions/rf-socialite",
    "extensions/rf-encryption",
    "crates/rf-response",
    "crates/rf-facades",
    "crates/forge-cli",
    # Phase 16-18: 100% Laravel Parity Features
    "extensions/rf-helpers",
    "crates/rf-sanctum",
    "extensions/rf-passport",
    "extensions/rf-inertia",
    # Examples
    "examples/hello",
