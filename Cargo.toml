[workspace]
members = [
    # Phase 2: New Modular Architecture (rf-*)
    "crates/rf-core",
    "crates/rf-web",
    "crates/rf-config",
    "crates/rf-container",
    "crates/rf-orm",
    "crates/rf-model-macro",
    "crates/rf-auth",
    "crates/rf-validation",
    "crates/rf-validation-derive",
    "crates/rf-macros",
    "crates/rf-request",
    "crates/rf-jobs",
    "crates/rf-mail",
    "crates/rf-storage",
    "crates/rf-ratelimit",
    "crates/rf-broadcast",
    "crates/rf-broadcasting",
    "crates/rf-testing",
    "crates/rf-health",
    "crates/rf-queue",
    "crates/rf-scheduler",
    "crates/rf-graphql",
    "crates/rf-tenancy",
    "crates/rf-cache",
    "crates/rf-oauth2-server",
    "crates/rf-logging",
    "crates/rf-metrics",
    "crates/rf-swagger",
    "crates/rf-pagination",
    "crates/rf-upload",
    "crates/rf-sse",
    "crates/rf-2fa",
    "crates/rf-search",
    "crates/rf-cli-gen",
    "crates/rf-events",
    "crates/rf-notifications",
    "crates/rf-feature-flags",
    "crates/rf-deploy",
    "crates/rf-audit",
    "crates/rf-export",
    "crates/rf-i18n",
    "crates/rf-admin",
    "crates/rf-blade",
    "crates/rf-vite",
    "crates/rf-livereload",
    "crates/rf-cms",
    "crates/rf-scaffold",
    "crates/rf-breeze",
    "crates/rf-views",
    "crates/rf-view",
    "crates/rf-authorization",
    # Phase 13: Eloquent ORM
    "crates/rf-eloquent",
    # Phase 14: API & Developer Experience
    "crates/rf-api-resources",
    "crates/rf-requests",
    "crates/rf-collections",
    "crates/rf-routing",
    "crates/rf-route-facade",
    "crates/rf-global-helpers",
    # Phase 20: Laravel Facades
    "crates/rf-auth-facade",
    "crates/rf-db-facade",
    "crates/rf-cache-facade",
    "crates/rf-event-facade",
    "crates/rf-storage-facade",
    "crates/rf-log-facade",
    "crates/rf-mail-facade",
    "crates/rf-session-facade",
    "crates/rf-config-facade",
    "crates/rf-view-facade",
    # RustForge - single import for everything
    "crates/rustforge",
    # Phase 15: Monitoring & Debugging
    "crates/rf-horizon",
    "crates/rf-telescope",
    # Phase 16: Error Handling
    "crates/rf-errors",
    # Phase 16-17: Ecosystem & Polish
    "crates/rf-package-dev",
    "crates/rf-providers",
    "crates/rf-socialite",
    "crates/rf-encryption",
    "crates/rf-response",
    "crates/rf-facades",
    "crates/forge-cli",
    # Phase 16-18: 100% Laravel Parity Features
    "crates/rf-helpers",
    "crates/rf-sanctum",
    "crates/rf-inertia",
    # Examples
    "examples/hello",
    "examples/database-demo",
    "examples/auth-demo",
    "examples/validation-demo",
    "examples/jobs-demo",
    "examples/mail-demo",
    "examples/scaffold-demo",
    "examples/macros-demo",
    "examples/laravel-syntax-complete",
    "examples/laravel-syntax-simple",
    "examples/facades-demo",
    # Framework Test
    "benchmarks",
    # "framework-test", # Excluded - incomplete
    # Legacy CLI (kept as foundry-cli)
    # "crates/foundry-cli", # Temporarily disabled - requires rf-application
    # All other packages now use rf-* prefix
    # "crates/rf-application", # Temporarily disabled - requires rf-infra
    "crates/rf-domain",
    # "crates/rf-infra", # Temporarily disabled - requires dependency migration
    "crates/rf-plugins",
    # "crates/rf-api", # Temporarily disabled - requires rf-application
    "crates/rf-interactive",
    "crates/rf-console",
    "crates/rf-scheduling",
    "crates/rf-service-container",
    "crates/rf-resources",
    "crates/rf-soft-deletes",
    # "crates/rf-oauth", # Temporarily disabled - requires dependency migration
    # "crates/rf-oauth-server", # Temporarily disabled - use rf-oauth2-server
    "crates/rf-auth-scaffolding",
    "crates/rf-forms",
    "crates/rf-http-client",
    "crates/rf-tinker-enhanced",
    "crates/rf-maintenance",
    "crates/rf-env",
    "crates/rf-assets",
    "crates/rf-command-executor",
    # "crates/rf-command-events", # Temporarily disabled - type errors
    # "crates/rf-command-pipeline", # Temporarily disabled - may depend on rf-command-events
    "crates/rf-signal-handler",
    "crates/rf-observability",
    # "crates/rf-advanced-input", # Temporarily disabled - compile errors
    "crates/rf-stub-system",
    "crates/rf-verbosity",
]
exclude = ["starter-template"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "MIT OR Apache-2.0"
authors = ["chregu12"]
repository = "https://github.com/Chregu12/RustForge"
homepage = "https://github.com/Chregu12/RustForge"
documentation = "https://github.com/Chregu12/RustForge"
keywords = ["web", "framework", "laravel", "rest", "api"]
categories = ["web-programming::http-server", "web-programming"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde", "clock"] }
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "macros", "with-rust_decimal", "with-chrono"] }
axum = { version = "0.8", features = ["macros", "json", "multipart", "ws"] }
toml = "0.8"
rustyline = "14.0"
regex = "1.10"
console = "0.15"
indicatif = "0.17"
tokio-tungstenite = "0.21"
futures = "0.3"
tower = { version = "0.4", features = ["util"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
jsonwebtoken = "9.2"
argon2 = "0.5"
tower-sessions = "0.12"
bcrypt = "0.15"
async-graphql = { version = "7.0", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.0"

# Performance Optimizations (Phase 3)
rustc-hash = "1.1"
smallvec = { version = "1.13", features = ["serde"] }
rkyv = { version = "0.7", features = ["validation"] }
once_cell = "1.19"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
dhat = "0.3"
base64 = "0.21"
dashmap = "5.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Phase 2: Additional dependencies
validator = { version = "0.18", features = ["derive"] }
redis = { version = "0.24", features = ["aio", "tokio-comp", "connection-manager"] }
deadpool-redis = "0.14"
config = "0.14"
cron = "0.13"
num_cpus = "1.16"
