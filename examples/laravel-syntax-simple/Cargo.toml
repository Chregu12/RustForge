[package]
name = "laravel-syntax-simple"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simple"
path = "src/main.rs"

[dependencies]
rf = { path = "../../crates/rf" }
rf-validation = { path = "../../crates/rf-validation" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
