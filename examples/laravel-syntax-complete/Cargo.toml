[package]
name = "laravel-syntax-complete"
version = "1.0.0"
edition = "2021"

[dependencies]
# RustForge - Laravel Syntax
rf-global-helpers = { path = "../../crates/rf-global-helpers" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web
axum = "0.7"
tower = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "blog"
path = "src/main.rs"
