<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@yield('title') - RustForge Blog</title>

    @if($vite_dev)
        <!-- Vite Dev Server -->
        <script type="module" src="http://localhost:5173/@vite/client"></script>
        <script type="module" src="http://localhost:5173/resources/js/app.js"></script>
        <link rel="stylesheet" href="http://localhost:5173/resources/css/app.css">

        <!-- LiveReload -->
        <script>
        (function() {
            const ws = new WebSocket('ws://localhost:35729');
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.kind === 'CssOnly') {
                    const links = document.querySelectorAll('link[rel="stylesheet"]');
                    links.forEach(link => {
                        const href = link.href.split('?')[0];
                        link.href = href + '?reload=' + Date.now();
                    });
                } else {
                    window.location.reload();
                }
            };
            ws.onerror = () => console.log('LiveReload disconnected');
        })();
        </script>
    @else
        <!-- Production Assets -->
        <link rel="stylesheet" href="/build/assets/app.css">
        <script type="module" src="/build/assets/app.js"></script>
    @endif

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2em; }
        nav { margin-top: 10px; }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            opacity: 0.9;
        }
        nav a:hover { opacity: 1; }
        main { min-height: 70vh; }
        footer {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>RustForge Blog</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/posts/create">New Post</a>
                <a href="/admin">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        @yield('content')
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 RustForge Blog - Built with Phase 12 Features</p>
            <p><small>rf-blade | rf-vite | rf-livereload | rf-cms</small></p>
        </div>
    </footer>
</body>
</html>
