[package]
name = "phase12-blog"
version = "0.1.0"
edition = "2021"

# Standalone package, not part of workspace
[workspace]

[[bin]]
name = "blog-server"
path = "src/main.rs"

[dependencies]
# RustForge Phase 12 crates
rf-blade = { path = "../../crates/rf-blade" }
rf-vite = { path = "../../crates/rf-vite" }
rf-livereload = { path = "../../crates/rf-livereload" }
rf-cms = { path = "../../crates/rf-cms" }

# Core framework
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database (simulated with in-memory for demo)
dashmap = "5.5"

# Time
chrono = "0.4"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }
