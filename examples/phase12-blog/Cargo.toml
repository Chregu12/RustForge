[package]
name = "phase12-blog"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "blog-server"
path = "src/main.rs"

[dependencies]
# The whole example is written against the `rf` umbrella + an async runtime,
# using ONLY the high-level primitives (no bare axum handlers).
rf = { path = "../../crates/rf" }
# axum 0.8 to match rf-routing's Router; serde is needed by the Model! derive.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
