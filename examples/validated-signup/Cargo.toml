[package]
name = "validated-signup"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# `Model!` (re-exported as `rf::Model`) -> entity + Create/Update DTOs and,
# when opted in with `validated`, a real `rf_validation::Validate` impl.
rf = { path = "../../crates/rf" }
# The generated struct does `impl rf_db_facade::Model for X`; hardcoded path.
rf-db-facade = { path = "../../extensions/rf-db-facade" }
# The auto-validating `ValidatedJson` extractor + the `Validate` trait the
# generated impl targets.
rf-validation = { path = "../../crates/rf-validation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
# `ValidatedJson` is a `FromRequest` built against axum 0.8. The framework's own
# HTTP stack (rf-routing's `post`/`build_router`) is now aligned on axum 0.8 too,
# so this extractor plugs directly into rf::post — no raw-axum workaround needed.
axum = "0.8"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
