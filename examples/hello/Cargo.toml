[package]
name = "hello"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# Phase 2 Framework Crates
rf-core = { path = "../../crates/rf-core", features = ["axum"] }
rf-web = { path = "../../crates/rf-web" }
rf-config = { path = "../../crates/rf-config" }
rf-container = { path = "../../crates/rf-container" }

# Web Framework - Pin to 0.7 to match rf-core
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { workspace = true, features = ["full"] }
tower.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true
