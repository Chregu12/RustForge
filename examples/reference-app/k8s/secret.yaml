# =============================================================================
# RustForge Reference Application — Kubernetes Secret TEMPLATE
# =============================================================================
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# THIS FILE IS A TEMPLATE — DO NOT COMMIT REAL SECRETS.
# Replace every REPLACE_WITH_… placeholder before applying to a real cluster.
# Use a secrets manager (Vault, AWS Secrets Manager, Sealed Secrets, External
# Secrets Operator) to inject real values; never store plaintext secrets in git.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# Apply (after filling in real values, or via external secrets injection):
#   kubectl apply -f examples/reference-app/k8s/secret.yaml
#
# Rotate: update the values and run `kubectl rollout restart deployment/reference-app`.

apiVersion: v1
kind: Secret
metadata:
  name: reference-app-secrets
  namespace: default
  labels:
    app: reference-app
    component: secrets
# stringData: values are base64-encoded by Kubernetes on apply.
# Use `kubectl create secret generic` or a secrets manager for production.
type: Opaque
stringData:
  # JWT signing secret — must be at least 32 characters.
  # Generate: openssl rand -hex 32
  JWT_SECRET: "REPLACE_WITH_RANDOM_32_CHAR_HEX_SECRET"

  # SMTP credentials (leave blank for MailHog which has no auth).
  # Set SMTP_HOST in ConfigMap to enable SMTP; absent → FileMailer.
  SMTP_HOST: "REPLACE_WITH_SMTP_HOST"
  SMTP_USER: "REPLACE_WITH_SMTP_USERNAME_OR_LEAVE_BLANK"
  SMTP_PASS: "REPLACE_WITH_SMTP_PASSWORD_OR_LEAVE_BLANK"

  # Future: Postgres connection string (not wired today — see DATABASE_URL note
  # in configmap.yaml). Included so the Secret shape is production-complete.
  POSTGRES_PASSWORD: "REPLACE_WITH_POSTGRES_PASSWORD"

  # Future: Redis URL for rf-cache RedisManager (not wired today).
  # REDIS_URL: "redis://:password@redis-host:6379/0"

  # Future: S3/MinIO credentials for rf-storage S3Manager (not wired today).
  # S3_ACCESS_KEY_ID:     "REPLACE_WITH_ACCESS_KEY"
  # S3_SECRET_ACCESS_KEY: "REPLACE_WITH_SECRET_KEY"
  # S3_BUCKET:            "REPLACE_WITH_BUCKET_NAME"
  # S3_REGION:            "us-east-1"
  # S3_ENDPOINT:          "https://s3.amazonaws.com"
