[package]
name = "i18n-localized-api"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# rf-i18n with the `axum` feature enables the AcceptLanguage extractor.
rf-i18n = { path = "../../crates/rf-i18n", features = ["axum"] }
# axum 0.8 matches the rf-i18n axum integration version.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
